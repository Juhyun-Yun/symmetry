                                                className={ex ? '' : 'a-ring'} style={{ cursor: 'pointer' }} onClick={() => doExp(i)} />
                                            <text x={p.x - 22} y={p.y + 5} fontSize="14" fill={lesson.deep}>{p.n}</text>
                                            <circle cx={m.x} cy={m.y} r="7" fill={ex ? lesson.deep : lesson.color} stroke="white" strokeWidth="2" opacity={ex ? 1 : 0.4} />
                                            <text x={m.x + 12} y={m.y + 5} fontSize="14" fill={lesson.deep} opacity={ex ? 1 : 0.4}>{m.n}</text>
                                        </g>
                                    );
                                })}
                                {/* 대칭축 — 도형 위에 보이도록 마지막에 그림 */}
                                <line x1={AX} y1="20" x2={AX} y2={VBH - 15} stroke={lesson.color} strokeWidth="3" strokeDasharray="7,5" />
                                <rect x={AX - 26} y="18" width="52" height="22" rx="11" fill="white" stroke={lesson.color} strokeWidth="1.5" />
                                <text x={AX} y="34" textAnchor="middle" fontSize="14" fontWeight="bold" fill={lesson.deep}>대칭축</text>
                            </svg>
                        }
                        panel={<Fragment>
                            <Says color={lesson.deep}>
                                왼쪽 점 <b>ㄱ · ㄴ · ㄷ</b>을 차례로 눌러요. 대응점과 어떤 관계인지 봐봐요. <b>({explored.length}/{LEFT.length})</b>
                            </Says>
                            {explored.length < LEFT.length && <Hint>대칭축과 만난 자리에 <b>직각</b>이 그어지는 것을 보세요.</Hint>}
                            {explored.length === LEFT.length && <Fragment>
                                <Discover><div style={{ fontSize: '0.82em', lineHeight: 1.4 }}>① 대응점을 이은 선은 <span className={lesson.hlClass}>대칭축에 수직</span>!</div></Discover>
                                <Discover><div style={{ fontSize: '0.82em', lineHeight: 1.4 }}>② 대응점은 <span className="hl-y">대칭축에서 같은 거리</span>!</div></Discover>
                            </Fragment>}
                        </Fragment>}
                    />
                </StageBody>
            );
        };

        const L5 = ({ lesson, onComplete }) => {
            const G = 40, COLS = 14, ROWS = 9, AXIS = 7;
            const VBW = COLS * G, VBH = ROWS * G;
            const TOP = { x: AXIS, y: 1 }, BOT = { x: AXIS, y: 8 };
            const PROBS = [
                { left: [{ x: 3, y: 2 }, { x: 2, y: 5 }, { x: 3, y: 7 }], name: '뾰족한 꽃잎' },
                { left: [{ x: 4, y: 2 }, { x: 1, y: 4 }, { x: 4, y: 6 }, { x: 3, y: 7 }], name: '비대칭 잎' },
                { left: [{ x: 2, y: 3 }, { x: 3, y: 5 }, { x: 2, y: 7 }], name: '안쪽 굽은 도형' },
                { left: [{ x: 5, y: 2 }, { x: 1, y: 4 }, { x: 5, y: 6 }, { x: 4, y: 8 }], name: '긴 꼬리 도형' },
                { left: [{ x: 3, y: 2 }, { x: 1, y: 3 }, { x: 2, y: 5 }, { x: 1, y: 7 }, { x: 3, y: 8 }], name: '울퉁불퉁 도형' },
            ];
            const [pIdx, setPIdx] = useState(0);
            const LEFT_PTS = PROBS[pIdx].left;
            const TARGETS = LEFT_PTS.map(p => ({ x: 2 * AXIS - p.x, y: p.y }));
            const svgRef = useRef(null);
            const toCoord = useSvgCoord(svgRef);
            const [phase, setPhase] = useState(0);
            const [marks, setMarks] = useState([]);
            const [folded, setFolded] = useState(false);

            const isLast = pIdx === PROBS.length - 1;
            useEffect(() => { if (folded && isLast) setTimeout(onComplete, 1500); }, [folded, isLast]);

            const nextProblem = () => {
                setPIdx(pIdx + 1);
                setMarks([]); setFolded(false); setPhase(1);
            };

            const onClick = (e) => {
                if (phase !== 1 || marks.length >= LEFT_PTS.length) return;
                const c = toCoord(e); if (!c) return;
                const gx = Math.round(c.x / G), gy = Math.round(c.y / G);
                if (gx <= AXIS) return;
                const idx = marks.length, t = TARGETS[idx];
                if (gy !== t.y) return;
                const ok = gx === t.x;
                setMarks(m => [...m, { x: gx, y: gy, ok }]);
                if (ok && marks.length + 1 === LEFT_PTS.length) setTimeout(() => setPhase(2), 500);
            };

            const halfPath = [TOP, ...LEFT_PTS, BOT].map(p => `${p.x * G},${p.y * G}`).join(' ');
            const fullPoly = phase >= 2 ? [TOP, ...LEFT_PTS, BOT, ...[...TARGETS].reverse()].map(p => `${p.x * G},${p.y * G}`).join(' ') : null;

            if (phase === 0) {
                return (
                    <main className="page-main page-pad" style={{ display: 'grid', placeItems: 'center' }}>
                        <div className="surface max-w-2xl text-center" style={{ padding: 'clamp(1.5rem,3vw,2.5rem)' }}>
                            <Mascot size={88} />
                            <div className="ff-display t-xl mt-3 mb-2" style={{ color: lesson.deep }}>이제 네 차례야!</div>
                            <p className="t-base mb-5" style={{ color: 'var(--ink-2)' }}>
                                <b className={lesson.hlClass}>5개 도형</b>의 절반이 있어요. 대응점을 찍어 완성한 다음 <span className="hl">접어서</span> 확인해요.
                            </p>
                            <button onClick={() => setPhase(1)} className="btn btn-primary" style={{ background: lesson.color }}>시작 →</button>
                        </div>
                    </main>
                );
            }

            return (
                <StageBody>
                    <Split
                        canvas={
                            <svg ref={svgRef} viewBox={`0 0 ${VBW} ${VBH}`} className={`w-full h-full ${phase === 1 ? 'cursor-crosshair' : ''}`} onClick={onClick}>
                                <defs>
                                    <pattern id="l5g" width={G} height={G} patternUnits="userSpaceOnUse"><path d={`M ${G} 0 L 0 0 0 ${G}`} fill="none" stroke="var(--line-soft)" strokeWidth="0.8" /></pattern>
                                    <clipPath id="l5L"><rect x="0" y="0" width={AXIS * G} height={VBH} /></clipPath>
                                    <clipPath id="l5R"><rect x={AXIS * G} y="0" width={VBW - AXIS * G} height={VBH} /></clipPath>
                                </defs>
                                <rect width={VBW} height={VBH} fill="url(#l5g)" />

                                {phase === 1 && (
                                    <polyline points={halfPath} fill="none" stroke={lesson.deep} strokeWidth="3.5" strokeLinejoin="round" strokeLinecap="round" />
                                )}

                                {phase >= 2 && fullPoly && (
                                    <Fragment>
                                        {/* 면 채움 — 옅게 배경으로 (접히면 더 옅게) */}
                                        <polygon points={fullPoly} fill={lesson.light} fillOpacity={folded ? 0.3 : 0.45} stroke="none" />

                                        {/* 왼쪽 절반(원래 있던 변) — 기본 색, 항상 위치 고정 */}
                                        <g clipPath="url(#l5L)">
                                            <polygon points={fullPoly} fill="none" stroke={lesson.deep} strokeWidth="3.5" strokeLinejoin="round" />
                                        </g>

                                        {/* 오른쪽 절반(학생이 만든 새 변) — 강조 색, 접기 시 천천히 좌측으로 접힘 */}
                                        <g style={{
                                            transform: folded ? `matrix(-1, 0, 0, 1, ${2 * AXIS * G}, 0)` : 'matrix(1, 0, 0, 1, 0, 0)',
                                            transition: 'transform 1.6s cubic-bezier(0.5, 0, 0.3, 1)'
                                        }}>
                                            <g clipPath="url(#l5R)">
                                                <polygon points={fullPoly} fill="none" stroke="#FF7B53" strokeWidth="4"
                                                    strokeLinejoin="round" />
                                            </g>
                                        </g>
                                    </Fragment>
                                )}

                                <line x1={AXIS * G} y1="0" x2={AXIS * G} y2={VBH} stroke={lesson.color} strokeWidth="2.5" strokeDasharray="6,4" />
                                <text x={AXIS * G + 8} y="22" fontSize="14" fill={lesson.deep}>대칭축</text>

                                {!folded && [TOP, BOT].map((p, i) => <circle key={i} cx={p.x * G} cy={p.y * G} r="6" fill={lesson.deep} />)}
                                {!folded && LEFT_PTS.map((p, i) => <circle key={`lp-${i}`} cx={p.x * G} cy={p.y * G} r="6" fill={lesson.deep} />)}

                                {phase === 1 && marks.length < TARGETS.length && (() => {
                                    const t = TARGETS[marks.length];
                                    const src = LEFT_PTS[marks.length];
                                    return (
                                        <g>
                                            <line x1={src.x * G} y1={src.y * G} x2={t.x * G} y2={t.y * G} stroke={lesson.color} strokeWidth="1.5" strokeDasharray="4,3" opacity="0.7" />
                                            <circle cx={t.x * G} cy={t.y * G} r="10" fill="none" stroke={lesson.color} strokeWidth="2.5" strokeDasharray="3,2" className="a-ring" />
                                        </g>
                                    );
                                })()}

                                {!folded && marks.map((m, i) => <circle key={`m-${i}`} cx={m.x * G} cy={m.y * G} r="8" fill={m.ok ? 'var(--ok)' : 'var(--warn)'} stroke="white" strokeWidth="2.5" />)}

                                {folded && <text x={VBW / 2} y={VBH - 10} textAnchor="middle" fontSize="18" fontWeight="800" fill="var(--ok)">✨ 양쪽이 완전히 겹쳤어요!</text>}
                            </svg>
                        }
                        panel={<Fragment>
                            <div className="surface" style={{ padding: '0.5rem 0.8rem', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                                <span className="ff-display t-sm" style={{ color: 'var(--ink-3)' }}>문제 <b style={{color: lesson.deep, fontSize:'1.1em'}}>{pIdx + 1}</b> / {PROBS.length}</span>
                                <span className="t-sm" style={{ color: lesson.deep }}>{PROBS[pIdx].name}</span>
                            </div>
                            <Says color={lesson.deep}>
                                {phase === 1 && <Fragment><span className={lesson.hlClass}>같은 줄, 같은 거리</span>에 대응점을 찍어요. ({marks.length}/{LEFT_PTS.length})</Fragment>}
                                {phase === 2 && !folded && <Fragment>잘 그렸어요! <span style={{color:'#FF7B53', fontWeight:'bold'}}>주황색</span>이 네가 만든 변이에요. <span className="hl">접어서</span> 확인!</Fragment>}
                                {folded && !isLast && <Fragment>✨ 완성! 다음 도형으로!</Fragment>}
                                {folded && isLast && <Fragment>✨ 5문제 모두 완성! 선대칭 마스터!</Fragment>}
                            </Says>
                            {phase === 1 && marks.some(m => !m.ok) && (
                                <button onClick={() => setMarks([])} className="btn btn-soft">다시 찍기</button>
                            )}
                            {phase === 2 && !folded && (
                                <button onClick={() => setFolded(true)} className="btn btn-primary" style={{ background: lesson.color }}>접어보기 →</button>
                            )}
                            {folded && !isLast && (
                                <button onClick={nextProblem} className="btn btn-primary" style={{ background: lesson.color }}>다음 도형 →</button>
                            )}
                            {folded && isLast && <Discover>대응점은 대칭축에서 <span className={lesson.hlClass}>같은 거리</span>, <span className="hl-y">수직</span>! 이 성질로 그릴 수 있어요.</Discover>}
                        </Fragment>}
                    />
                </StageBody>
            );
        };

        window.registerStages('line', [L1, L2, L3, L4, L5]);
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;
        const { Says, Discover, Hint, StageBody, Split, useSvgCoord, Mascot } = window.SHELL;

        const P1 = ({ lesson, onComplete }) => {
            const [rotated, setRotated] = useState(false);
            useEffect(() => { if (rotated) setTimeout(onComplete, 1300); }, [rotated]);
            const POLY = '-70,-32 60,-32 70,32 -60,32';
            return (
                <StageBody>
                    <div className="h-full w-full grid items-center min-h-0 md:grid-cols-2 grid-cols-1" style={{ gap: 'var(--gap-md)' }}>
                        <div className="surface min-h-0 h-full grid place-items-center" style={{ padding: '1rem' }}>
                            <svg viewBox="-150 -100 300 200" className="w-full h-full" style={{ maxHeight: 'min(62vh, 600px)' }}>
                                <polygon points={POLY} fill="none" stroke="var(--ink-3)" strokeWidth="2" strokeDasharray="4,3" opacity="0.65" />
                                <g style={{ transform: rotated ? 'rotate(180deg)' : 'rotate(0deg)', transformOrigin: '0 0', transition: 'transform 1.5s cubic-bezier(0.5, 0, 0.3, 1)' }}>
                                    <polygon points={POLY} fill={lesson.light} stroke={lesson.deep} strokeWidth="3.5" strokeLinejoin="round" />
                                </g>
                                <circle cx="0" cy="0" r="7" fill={lesson.deep} stroke="white" strokeWidth="2.5" />
                                <text x="14" y="6" fontSize="13" fill={lesson.deep}>중심</text>
                                {rotated && <text x="0" y="85" textAnchor="middle" fontSize="16" fill={lesson.deep}>처음과 똑같이 겹쳐요</text>}
                            </svg>
                        </div>
                        <div className="flex flex-col min-h-0 justify-center" style={{ gap: 'var(--gap-md)' }}>
                            <Says color={lesson.deep}>
                                가운데 점을 중심으로 <span className={lesson.hlClass}>180° 돌려볼까요</span>?
                            </Says>
                            {!rotated && (
                                <button onClick={() => setRotated(true)} className="btn btn-primary self-start" style={{ background: lesson.color }}>180° 돌려요 →</button>
                            )}
                            {rotated && (
                                <Discover>
                                    한 점을 중심으로 <span className="hl-y">180° 돌렸을 때</span> 처음과 완전히 겹치는 도형이 <span className={lesson.hlClass}>점대칭 도형</span>!
                                    이때 그 점을 <span className="hl-pk">대칭의 중심</span>이라고 합니다.
                                </Discover>
                            )}
                        </div>
                    </div>
                </StageBody>
            );
        };

        const RotByDrag = ({ poly, fill, stroke, onAt180, isSym }) => {
            const [rot, setRot] = useState(0);
            const dragging = useRef(false);
            const startMA = useRef(0);
            const startR = useRef(0);
            const svgRef = useRef(null);
            const toCoord = useSvgCoord(svgRef);

            const onDown = (e) => {
                e.stopPropagation();
                const c = toCoord(e); if (!c) return;
                dragging.current = true;
                startMA.current = Math.atan2(c.y, c.x) * 180 / Math.PI;
                startR.current = rot;
                e.preventDefault();
            };
            useEffect(() => {
                const move = (e) => {
                    if (!dragging.current) return;
                    const c = toCoord(e); if (!c) return;
                    const a = Math.atan2(c.y, c.x) * 180 / Math.PI;
                    let newR = startR.current + (a - startMA.current);
                    newR = ((newR % 360) + 360) % 360;
                    setRot(newR);
                    if (e.cancelable) e.preventDefault();
                };
                const up = () => { dragging.current = false; };
                window.addEventListener('mousemove', move);
                window.addEventListener('mouseup', up);
                window.addEventListener('touchmove', move, { passive: false });
                window.addEventListener('touchend', up);
                return () => {
                    window.removeEventListener('mousemove', move);
                    window.removeEventListener('mouseup', up);
                    window.removeEventListener('touchmove', move);
                    window.removeEventListener('touchend', up);
                };
            }, [rot, toCoord]);

            const at180 = rot >= 170 && rot <= 190;
            useEffect(() => { if (at180) onAt180 && onAt180(); }, [at180]);

            return (
                <div className="relative h-full">
                    <svg ref={svgRef} viewBox="-65 -55 130 110" className="w-full h-full" style={{ touchAction: 'none' }}>
                        <polygon points={poly} fill="none" stroke="var(--ink-3)" strokeWidth="1.5" strokeDasharray="3,2" opacity="0.6" />
                        <g transform={`rotate(${rot})`} style={{ cursor: 'grab' }} onMouseDown={onDown} onTouchStart={onDown}>
                            <polygon points={poly} fill={fill} stroke={stroke} strokeWidth="3" strokeLinejoin="round" />
                        </g>
                        <circle cx="0" cy="0" r="3.5" fill={stroke} />
                    </svg>
                    <div className="absolute bottom-1 right-2 t-xs ff-display" style={{ color: at180 ? (isSym ? 'var(--ok)' : 'var(--warn)') : 'var(--ink-3)' }}>{Math.round(rot)}°</div>
                </div>
            );
        };

        const P2 = ({ lesson, onComplete }) => {
            const SHAPES = [
                { id: 'rect', name: '직사각형', sym: true,  poly: '-55,-28 55,-28 55,28 -55,28' },
                { id: 'para', name: '평행사변형', sym: true, poly: '-60,-22 38,-22 60,22 -38,22' },
                { id: 'iso', name: '이등변삼각형', sym: false, poly: '0,-42 42,30 -42,30' },
                { id: 'trL', name: '직각삼각형', sym: false, poly: '-45,30 45,30 -45,-30' }
            ];
            const [tested, setTested] = useState({});
            const all = Object.keys(tested).length === SHAPES.length;
            useEffect(() => { if (all) onComplete(); }, [all]);

            return (
                <StageBody>
                    <div className="h-full w-full flex flex-col min-h-0" style={{ gap: 'var(--gap-sm)' }}>
                        <Says color={lesson.deep}>
                            도형을 <span className={lesson.hlClass}>마우스로 잡고 돌려봐요</span>. 180°에서 회색 점선과 <b>딱 겹치면</b> 점대칭이에요. <b>({Object.keys(tested).length}/{SHAPES.length})</b>
                        </Says>
                        <div className="flex-1 grid min-h-0" style={{ gridTemplateColumns: 'repeat(auto-fit, minmax(220px, 1fr))', gap: 'var(--gap-sm)' }}>
                            {SHAPES.map(s => {
                                const isT = !!tested[s.id];
                                return (
                                    <div key={s.id} className="surface flex flex-col" style={{ padding: '0.8rem', borderColor: isT ? (s.sym ? lesson.color : 'var(--warn)') : 'var(--line-soft)' }}>
                                        <div className="ff-display t-base text-center mb-1" style={{ color: 'var(--ink-2)' }}>{s.name}</div>
                                        <div className="flex-1 min-h-0">
                                            <RotByDrag poly={s.poly} fill={lesson.light} stroke={lesson.deep}
                                                onAt180={() => setTested(t => ({ ...t, [s.id]: true }))}
                                                isSym={s.sym} />
                                        </div>
                                        {isT && <div className="t-sm text-center mt-1 ff-display" style={{ color: s.sym ? lesson.color : 'var(--warn)' }}>
                                            {s.sym ? '✓ 점대칭' : '✗ 점대칭 아님'}
                                        </div>}
                                    </div>
                                );
                            })}
                        </div>
                        {all && <Discover>180°에서 처음과 같은 도형이 <span className={lesson.hlClass}>점대칭 도형</span>!</Discover>}
                    </div>
                </StageBody>
            );
        };

        const P3 = ({ lesson, onComplete }) => {
            const POLY = '-80,-40 60,-40 80,40 -60,40';
            const CANDS = [
                { id: 'tl', x: -80, y: -40, label: '꼭짓점 위' },
                { id: 'mid', x: 0, y: 0, label: '한가운데', correct: true },
                { id: 'edge', x: -10, y: -40, label: '윗변 위' }
            ];
            const [pick, setPick] = useState(null);
            const [rot, setRot] = useState(0);
            const [tested, setTested] = useState({});
            const handle = id => {
                if (pick === id) return;
                setPick(id); setRot(0);
                setTimeout(() => setRot(180), 250);
                setTimeout(() => setTested(t => ({ ...t, [id]: true })), 1500);
            };
            const got = pick === 'mid' && tested.mid;
            useEffect(() => { if (got) onComplete(); }, [got]);
            const picked = pick ? CANDS.find(c => c.id === pick) : null;

            return (
                <StageBody>
                    <Split
                        canvas={
                            <svg viewBox="-150 -100 300 200" className="w-full h-full">
                                <polygon points={POLY} fill="none" stroke="var(--ink-3)" strokeWidth="1.5" strokeDasharray="4,3" opacity="0.5" />
                                <g transform={picked ? `translate(${picked.x} ${picked.y}) rotate(${rot}) translate(${-picked.x} ${-picked.y})` : ''} style={{ transition: rot ? 'transform 1.2s ease' : 'none' }}>
                                    <polygon points={POLY} fill={lesson.light} stroke={lesson.deep} strokeWidth="3.5" strokeLinejoin="round" />
                                </g>
                                {CANDS.map(c => (
                                    <g key={c.id} onClick={() => handle(c.id)} style={{ cursor: 'pointer' }}>
                                        <circle cx={c.x} cy={c.y} r="20" fill="rgba(152,112,224,0.12)" stroke={lesson.color} strokeWidth="2" strokeDasharray="3,2" />
                                        <circle cx={c.x} cy={c.y} r={pick === c.id ? 10 : 6} fill={pick === c.id ? (c.correct ? 'var(--ok)' : 'var(--warn)') : lesson.deep} stroke="white" strokeWidth="2.5" />
                                        <text x={c.x} y={c.y + 5} textAnchor="middle" fontSize="13" fill="white" fontWeight="800" style={{ pointerEvents: 'none' }}>{pick === c.id ? (c.correct ? '✓' : '✗') : ''}</text>
                                    </g>
                                ))}
                            </svg>
                        }
                        panel={<Fragment>
                            <Says color={lesson.deep}>
                                <span className={lesson.hlClass}>대칭의 중심</span>은 어디일까요? 점 3개 중 하나를 눌러봐요.
                            </Says>
                            <div className="surface" style={{ padding: '0.6rem 0.9rem' }}>
                                <div className="ff-display t-sm" style={{ color: 'var(--ink-3)' }}>시도</div>
                                {CANDS.map(c => (
                                    <div key={c.id} className="flex justify-between t-sm py-0.5" style={{ color: tested[c.id] ? (c.correct ? lesson.color : 'var(--warn)') : 'var(--ink-3)' }}>
                                        <span>{c.label}</span><span>{tested[c.id] ? (c.correct ? '✓' : '✗') : '·'}</span>
                                    </div>
                                ))}
                            </div>
                            {pick && !got && tested[pick] && !CANDS.find(c => c.id === pick).correct && (
                                <Hint color="var(--warn)">그 점을 중심으로 돌리니 어긋났어요. 다른 점을 시도해봐요.</Hint>
                            )}
                            {got && <Discover>한가운데가 <span className={lesson.hlClass}>대칭의 중심</span>! 점대칭 도형의 중심은 단 하나입니다.</Discover>}
                        </Fragment>}
                    />
                </StageBody>
            );
        };

        const P4 = ({ lesson, onComplete }) => {
            const VBW = 580, VBH = 340, CX = 290, CY = 170;
            const PTS = [{ x: 180, y: 100, n: 'ㄱ' }, { x: 380, y: 100, n: 'ㄴ' }, { x: 400, y: 240, n: 'ㄷ' }, { x: 200, y: 240, n: 'ㄹ' }];
            const PAIRS = [{ a: PTS[0], b: PTS[2], an: 'ㄱ', bn: 'ㄷ' }, { a: PTS[1], b: PTS[3], an: 'ㄴ', bn: 'ㄹ' }];
            const [explored, setExplored] = useState([]);
            useEffect(() => { if (explored.length === PAIRS.length) onComplete(); }, [explored]);

            return (
                <StageBody>
                    <Split
                        canvas={
                            <svg viewBox={`0 0 ${VBW} ${VBH}`} className="w-full h-full">
                                <defs><pattern id="p4g" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M 22 0 L 0 0 0 22" fill="none" stroke="var(--line-soft)" strokeWidth="0.8" /></pattern></defs>
                                <rect width={VBW} height={VBH} fill="url(#p4g)" />
                                <polygon points={PTS.map(p => `${p.x},${p.y}`).join(' ')} fill={lesson.light} stroke={lesson.deep} strokeWidth="3.5" strokeLinejoin="round" />
                                {PAIRS.map((pr, i) => {
                                    const ex = explored.includes(i);
                                    if (!ex) return null;
                                    const d = Math.hypot(pr.a.x - CX, pr.a.y - CY);
                                    return (
                                        <g key={i}>
                                            <line x1={pr.a.x} y1={pr.a.y} x2={pr.b.x} y2={pr.b.y} stroke={lesson.color} strokeWidth="2.5" strokeDasharray="5,3" />
                                            <text x={(pr.a.x + CX) / 2 + 8} y={(pr.a.y + CY) / 2 - 5} fontSize="13" fill={lesson.deep}>{Math.round(d / 22)}칸</text>
                                            <text x={(pr.b.x + CX) / 2 + 8} y={(pr.b.y + CY) / 2 - 5} fontSize="13" fill={lesson.deep}>{Math.round(d / 22)}칸</text>
                                        </g>
                                    );
                                })}
                                {PAIRS.map((pr, i) => {
                                    const ex = explored.includes(i);
                                    return (
                                        <g key={`p-${i}`}>
                                            <circle cx={pr.a.x} cy={pr.a.y} r="9" fill={ex ? lesson.deep : lesson.color} stroke="white" strokeWidth="2.5"
                                                className={ex ? '' : 'a-ring'} style={{ cursor: 'pointer' }} onClick={() => !ex && setExplored(e => [...e, i])} />
                                            <text x={pr.a.x - 18} y={pr.a.y + 5} fontSize="14" fill={lesson.deep}>{pr.an}</text>
                                            <circle cx={pr.b.x} cy={pr.b.y} r="7" fill={ex ? lesson.deep : lesson.color} stroke="white" strokeWidth="2" opacity={ex ? 1 : 0.4} />
                                            <text x={pr.b.x + 10} y={pr.b.y + 18} fontSize="14" fill={lesson.deep} opacity={ex ? 1 : 0.4}>{pr.bn}</text>
                                        </g>
                                    );
                                })}
                                <circle cx={CX} cy={CY} r="9" fill="var(--warn)" stroke="white" strokeWidth="3" />
                                <text x={CX + 14} y={CY + 5} fontSize="13" fill="var(--warn)">중심</text>
                            </svg>
                        }
                        panel={<Fragment>
                            <Says color={lesson.deep}>
                                <b>ㄱ</b>과 <b>ㄴ</b>을 차례로 눌러요. 대응점까지 선이 그어집니다. <b>({explored.length}/{PAIRS.length})</b>
                            </Says>
                            {explored.length < PAIRS.length && <Hint>선이 어디를 지나는지, 거리가 어떤지 봐요.</Hint>}
                            {explored.length === PAIRS.length && <Fragment>
                                <Discover>① 대응점을 이은 선은 <span className={lesson.hlClass}>대칭의 중심을 지나요</span>.</Discover>
                                <Discover>② 중심에서 대응점까지의 거리는 <span className={lesson.hlClass}>서로 같아요</span>.</Discover>
                            </Fragment>}
                        </Fragment>}
                    />
                </StageBody>
            );
        };

        const P5 = ({ lesson, onComplete }) => {
            const G = 40, COLS = 14, ROWS = 9;
            const VBW = COLS * G, VBH = ROWS * G;
            const CENTER = { x: 7, y: 4 };
            // 첨부 PDF 참고 — HALF 첫/마지막은 중심선(y=4) 위에 두 — 전체 변의 정확히 절반이 보이고 중심에서 교차 안 함
            const PROBS = [
                { half: [{ x: 3, y: 4 }, { x: 5, y: 2 }, { x: 9, y: 2 }, { x: 11, y: 4 }], name: '육각형 모양' },
                { half: [{ x: 3, y: 4 }, { x: 5, y: 2 }, { x: 11, y: 4 }], name: '평행사변형' },
                { half: [{ x: 3, y: 4 }, { x: 4, y: 2 }, { x: 7, y: 1 }, { x: 8, y: 2 }, { x: 11, y: 4 }], name: '들어간 화살표' },
                { half: [{ x: 3, y: 4 }, { x: 4, y: 1 }, { x: 10, y: 1 }, { x: 11, y: 4 }], name: '사다리꼴' },
                { half: [{ x: 2, y: 4 }, { x: 4, y: 2 }, { x: 7, y: 3 }, { x: 10, y: 2 }, { x: 12, y: 4 }], name: 'M자 도형' },
            ];
            const [pIdx, setPIdx] = useState(0);
            const HALF = PROBS[pIdx].half;
            const TARGETS = HALF.map(p => ({ x: 2 * CENTER.x - p.x, y: 2 * CENTER.y - p.y }));
            // 첫/마지막은 중심선 위라 점대칭 대응이 HALF의 다른 끝점과 같음 → 학생이 찍을 점은 중간만
            const TARGETS_CLICK = TARGETS.slice(1, -1);
            const svgRef = useRef(null);
            const toCoord = useSvgCoord(svgRef);
            const [phase, setPhase] = useState(0);
            const [marks, setMarks] = useState([]);
            const [rotated, setRotated] = useState(false);

            const isLast = pIdx === PROBS.length - 1;
            useEffect(() => { if (rotated && isLast) setTimeout(onComplete, 1500); }, [rotated, isLast]);

            const nextProblem = () => {
                setPIdx(pIdx + 1);
                setMarks([]); setRotated(false); setPhase(1);
            };

            const onClick = (e) => {
                if (phase !== 1 || marks.length >= TARGETS_CLICK.length) return;
                const c = toCoord(e); if (!c) return;
                const gx = Math.round(c.x / G), gy = Math.round(c.y / G);
                if (gy <= CENTER.y) return;
                const idx = marks.length, t = TARGETS_CLICK[idx];
                const ok = gx === t.x && gy === t.y;
                setMarks(m => [...m, { x: gx, y: gy, ok }]);
                if (ok && marks.length + 1 === TARGETS_CLICK.length) setTimeout(() => setPhase(2), 500);
            };

            const halfPath = HALF.map(p => `${p.x * G},${p.y * G}`).join(' ');
            const fullPoly = phase >= 2 ? [...HALF, ...TARGETS_CLICK].map(p => `${p.x * G},${p.y * G}`).join(' ') : null;

            if (phase === 0) {
                return (
                    <main className="page-main page-pad" style={{ display: 'grid', placeItems: 'center' }}>
                        <div className="surface max-w-2xl text-center" style={{ padding: 'clamp(1.5rem,3vw,2.5rem)' }}>
                            <Mascot size={88} />
                            <div className="ff-display t-xl mt-3 mb-2" style={{ color: lesson.deep }}>이제 네 차례야!</div>
                            <p className="t-base mb-5" style={{ color: 'var(--ink-2)' }}>
                                <b className={lesson.hlClass}>5개 도형</b>의 절반과 중심점이 있어요. 대응점을 찍어 완성한 다음 <span className="hl">180° 돌려서</span> 확인해요.
                            </p>
                            <button onClick={() => setPhase(1)} className="btn btn-primary" style={{ background: lesson.color }}>시작 →</button>
                        </div>
                    </main>
                );
            }

            return (
                <StageBody>
                    <Split
                        canvas={
                            <svg ref={svgRef} viewBox={`0 0 ${VBW} ${VBH}`} className={`w-full h-full ${phase === 1 ? 'cursor-crosshair' : ''}`} onClick={onClick}>
                                <defs><pattern id="p5g" width={G} height={G} patternUnits="userSpaceOnUse"><path d={`M ${G} 0 L 0 0 0 ${G}`} fill="none" stroke="var(--line-soft)" strokeWidth="0.8" /></pattern></defs>
                                <rect width={VBW} height={VBH} fill="url(#p5g)" />

                                {phase === 1 && (
                                    <polyline points={halfPath} fill="none" stroke={lesson.deep} strokeWidth="3.5" strokeLinejoin="round" strokeLinecap="round" />
                                )}

                                {phase === 1 && marks.length < TARGETS_CLICK.length && (() => {
                                    // 가이드: HALF의 중간 점(인덱스 1부터)의 대응점이 학생이 찍을 위치
                                    const src = HALF[marks.length + 1];
                                    const t = TARGETS_CLICK[marks.length];
                                    return (
                                        <g>
                                            <line x1={src.x * G} y1={src.y * G} x2={t.x * G} y2={t.y * G} stroke={lesson.color} strokeWidth="1.5" strokeDasharray="4,3" opacity="0.7" />
                                            <circle cx={t.x * G} cy={t.y * G} r="10" fill="none" stroke={lesson.color} strokeWidth="2.5" strokeDasharray="3,2" className="a-ring" />
                                        </g>
                                    );
                                })()}

                                {marks.map((m, i) => <circle key={`m-${i}`} cx={m.x * G} cy={m.y * G} r="8" fill={m.ok ? 'var(--ok)' : 'var(--warn)'} stroke="white" strokeWidth="2.5" />)}

                                {HALF.map((p, i) => <circle key={`h-${i}`} cx={p.x * G} cy={p.y * G} r="6" fill={lesson.deep} stroke="white" strokeWidth="2" />)}

                                {phase >= 2 && fullPoly && (
                                    <g style={{ transformOrigin: `${CENTER.x * G}px ${CENTER.y * G}px`, transform: rotated ? 'rotate(180deg)' : 'rotate(0deg)', transition: 'transform 1.5s cubic-bezier(0.5,0,0.3,1)' }}>
                                        {/* 면 채움 (옅게) */}
                                        <polygon points={fullPoly} fill={lesson.light} fillOpacity="0.45" stroke="none" />
                                        {/* 기존 절반 변 (위쪽 HALF) */}
                                        <polyline points={HALF.map(p => `${p.x * G},${p.y * G}`).join(' ')}
                                            fill="none" stroke={lesson.deep} strokeWidth="4" strokeLinejoin="round" strokeLinecap="round" />
                                        {/* 새 변 (학생이 만든 부분) — HALF 마지막 → TARGETS_CLICK → HALF 첫, 강조 색 */}
                                        <polyline points={[HALF[HALF.length - 1], ...TARGETS_CLICK, HALF[0]].map(p => `${p.x * G},${p.y * G}`).join(' ')}
                                            fill="none" stroke="#FF7B53" strokeWidth="4" strokeLinejoin="round" strokeLinecap="round" />
                                    </g>
                                )}
                                {rotated && fullPoly && (
                                    <polygon points={fullPoly} fill="none" stroke="var(--ok)" strokeWidth="2.5" strokeDasharray="6,3" />
                                )}

                                <circle cx={CENTER.x * G} cy={CENTER.y * G} r="9" fill="var(--warn)" stroke="white" strokeWidth="3" />
                                <text x={CENTER.x * G + 14} y={CENTER.y * G + 5} fontSize="14" fill="var(--warn)">중심</text>

                                {rotated && <text x={VBW / 2} y={VBH - 12} textAnchor="middle" fontSize="18" fontWeight="800" fill="var(--ok)">✨ 처음과 똑같이 겹쳤어요!</text>}
                            </svg>
                        }
                        panel={<Fragment>
                            <div className="surface" style={{ padding: '0.5rem 0.8rem', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                                <span className="ff-display t-sm" style={{ color: 'var(--ink-3)' }}>문제 <b style={{color: lesson.deep, fontSize:'1.1em'}}>{pIdx + 1}</b> / {PROBS.length}</span>
                                <span className="t-sm" style={{ color: lesson.deep }}>{PROBS[pIdx].name}</span>
                            </div>
                            <Says color={lesson.deep}>
                                {phase === 1 && <Fragment>중심에서 <span className={lesson.hlClass}>반대편 같은 거리</span>에 대응점 찍기 ({marks.length}/{TARGETS_CLICK.length})</Fragment>}
                                {phase === 2 && !rotated && <Fragment>잘 그렸어요! <span style={{color:'#FF7B53', fontWeight:'bold'}}>주황색</span>이 네가 만든 변. <span className="hl">180° 돌려서</span> 확인!</Fragment>}
                                {rotated && !isLast && <Fragment>✨ 똑같이 겹쳤어요! 다음 문제!</Fragment>}
                                {rotated && isLast && <Fragment>✨ 5문제 모두 완성! 점대칭 마스터!</Fragment>}
                            </Says>
                            {phase === 1 && marks.some(m => !m.ok) && (
                                <button onClick={() => setMarks([])} className="btn btn-soft">다시 찍기</button>
                            )}
                            {phase === 2 && !rotated && (
                                <button onClick={() => setRotated(true)} className="btn btn-primary" style={{ background: lesson.color }}>180° 돌려보기 →</button>
                            )}
                            {rotated && !isLast && (
                                <button onClick={nextProblem} className="btn btn-primary" style={{ background: lesson.color }}>다음 도형 →</button>
                            )}
                            {rotated && isLast && <Discover>대응점은 <span className={lesson.hlClass}>중심에서 같은 거리</span>, 대응점을 이은 선은 <span className="hl-y">중심을 지나요</span>.</Discover>}
                        </Fragment>}
                    />
                </StageBody>
            );
        };

        window.registerStages('pt', [P1, P2, P3, P4, P5]);
    </script>
</body>

</html>
